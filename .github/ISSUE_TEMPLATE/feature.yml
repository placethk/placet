name: Feature request
description: A change to the pipeline, Skills, or docs
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Placet do instead?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Pipeline / CLAUDE.md / PLACET.md
        - Skills (placet-*)
        - Knowledge base / fact gate
        - Install / docs
        - Other
    validations:
      required: true
